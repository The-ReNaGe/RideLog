server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ══════════════════════════════════════════════════════════════════════
    # RÉSOLUTION DNS DYNAMIQUE DU BACKEND
    # ══════════════════════════════════════════════════════════════════════
    # Avec un nom d'hôte écrit en dur (proxy_pass http://backend:8000), nginx
    # ne résout `backend` QU'UNE FOIS, au démarrage du worker, et garde cette
    # IP pour toute sa durée de vie. Un backend recréé (mise à jour d'image,
    # redémarrage) reçoit une nouvelle IP : nginx continue d'écrire vers
    # l'ancienne et toute l'API tombe en 502 jusqu'au redémarrage du frontend.
    #
    # Passer par une variable force nginx à repasser par le resolver, donc à
    # re-résoudre toutes les `valid=`.
    #
    # RIDELOG_RESOLVER est remplacé au démarrage du conteneur par
    # docker-entrypoint.d/10-resolver.sh, qui lit le vrai serveur DNS dans
    # /etc/resolv.conf. Pas de valeur en dur : Docker écoute sur 127.0.0.11,
    # Podman sur la passerelle du réseau — figer l'une casserait l'autre.
    resolver RIDELOG_RESOLVER valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend (exact /api match for health/config)
    location = /api {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large uploads (invoices)
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 12M;
    }

    # Health check proxy
    location /health {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback – serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
