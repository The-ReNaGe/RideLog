name: Publier les images

on:
  push:
    branches: [main]

  workflow_call:
    inputs:
      version:
        description: "Tag de version à publier (ex: v2.0.0 ou 2.0.0)"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      source:
        description: "Tag source, déjà publié (ex: latest, 2.0.0)"
        required: true
        default: "latest"
        type: string
      target:
        description: "Tag à créer ou déplacer (ex: stable)"
        required: true
        default: "stable"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer l'émulation ARM
        uses: docker/setup-qemu-action@v3

      - name: Préparer buildx
        uses: docker/setup-buildx-action@v3

      - name: S'authentifier auprès de ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déterminer les tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/ridelog-${{ matrix.component }}"

          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            VERSION="${VERSION#v}"
            echo "tags=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
            echo "resume=${IMAGE}:${VERSION} (version épinglable)" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:latest,${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "resume=${IMAGE}:latest + sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Résumé
        run: echo "✅ ${{ steps.meta.outputs.resume }}" >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - name: Préparer buildx
        uses: docker/setup-buildx-action@v3

      - name: S'authentifier auprès de ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promouvoir ${{ inputs.source }} → ${{ inputs.target }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/ridelog-${{ matrix.component }}"
          SOURCE="${{ inputs.source }}"; SOURCE="${SOURCE#v}"
          TARGET="${{ inputs.target }}"; TARGET="${TARGET#v}"

          docker buildx imagetools create \
            --tag "${IMAGE}:${TARGET}" \
            "${IMAGE}:${SOURCE}"

          echo "✅ ${IMAGE}: ${SOURCE} → ${TARGET}" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:${TARGET}" | head -5
