name: Analyse de sécurité (Trivy)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - backend/requirements*.txt
      - frontend/package-lock.json
      - "**/Dockerfile"
      - .github/workflows/trivy.yml

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Trivy — dépendances et secrets
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy — configuration (Dockerfiles)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
